<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | متجرك الإلكتروني</title>
  <link rel="icon" href="assets/logo/logo.png">
  <link rel="stylesheet" href="css/style.css?v=50">
  <link rel="stylesheet" href="css/refresh.css?v=50">
</head>
<body>

<div id="site-header" data-active="products"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / <a href="products.html">المنتجات</a> / تفاصيل المنتج</div>
    </div>
  </section>

  <section class="section" style="padding-top:10px;">
    <div class="container">
      <div id="productDetail">
        <!-- هيكل تحميل تمهيدي أنيق لتفادي الشاشة البيضاء -->
        <div class="detail-grid">
          <div class="detail-media skeleton-card" style="aspect-ratio: 1/1; min-height: 360px;"></div>
          <div class="detail-info">
            <div class="skeleton-box skeleton-text" style="width: 30%; height: 18px; margin-bottom: 12px;"></div>
            <div class="skeleton-box skeleton-text" style="width: 80%; height: 32px; margin-bottom: 16px;"></div>
            <div class="skeleton-box skeleton-price" style="width: 40%; height: 26px; margin-bottom: 24px;"></div>
            <div class="skeleton-box skeleton-text" style="width: 100%; height: 80px; margin-bottom: 20px;"></div>
            <div class="skeleton-box skeleton-text" style="width: 60%; height: 46px;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js?v=50"></script>
<script src="js/icons.js?v=50"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

</html>
