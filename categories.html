<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأقسام | متجرك الإلكتروني</title>
  <link rel="icon" href="assets/logo/logo.png">
  <link rel="stylesheet" href="css/style.css?v=42">
  <link rel="stylesheet" href="css/refresh.css?v=42">
  <style>
    .cat-main-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg, 20px);
      padding: 22px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .cat-main-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card);
      border-color: var(--olive-400);
    }
    .cat-card-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .cat-card-img {
      width: 65px;
      height: 65px;
      border-radius: 16px;
      background: var(--olive-100);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .cat-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cat-card-img svg {
      width: 32px;
      height: 32px;
      color: var(--olive-700);
    }
    .cat-card-title h3 {
      margin: 0 0 4px;
      font-size: 1.15rem;
      color: var(--ink-900);
    }
    .cat-card-title span {
      font-size: 0.8rem;
      color: var(--ink-400);
      font-weight: 600;
    }
    .cat-sub-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .cat-sub-chip {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: var(--olive-50);
      border: 1px solid var(--line);
      color: var(--ink-700);
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s ease;
      text-decoration: none;
    }
    .cat-sub-chip:hover {
      background: var(--olive-700);
      color: #fff;
      border-color: var(--olive-700);
    }
  </style>
</head>
<body>

<div id="site-header" data-active="categories"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / الأقسام</div>
      <h1>أقسام المتجر</h1>
      <p>تصفّح منتجاتنا بسهولة عبر استعراض الأقسام وتصنيفاتها الفرعية.</p>
    </div>
  </section>

  <section class="section" style="padding-top: 25px;">
    <div class="container">
      <div class="category-grid" id="categoriesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        <!-- سيتم رسم الأقسام برمجياً هنا -->
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js?v=42"></script>
<script src="js/icons.js?v=42"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/store.js?v=42"></script>
<script src="js/whatsapp.js?v=42"></script>
<script src="js/app.js?v=42"></script>
<script>
  function renderAllCategoriesPage() {
    const grid = document.getElementById("categoriesGrid");
    if (!grid) return;

    const allCategories = Store.getCategories();
    const allProducts = Store.getProducts();
    const mainCategories = allCategories.filter(c => !c.parentId);

    if (mainCategories.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">' + iconSvg("box") + '<p>لا توجد أقسام مضافة بعد.</p></div>';
      return;
    }

    grid.innerHTML = mainCategories.map(main => {
      const subCats = allCategories.filter(c => c.parentId === main.id);
      const mainProdCount = allProducts.filter(p => p.categoryId === main.id || subCats.some(s => s.id === p.categoryId)).length;

      let media = iconSvg(main.icon || "box");
      if (main.image) {
        const optimizedImg = main.image.replace(/tr:[^/]+/g, "tr:w-700,q-85");
        media = '<img src="' + escapeHtml(optimizedImg) + '" alt="' + escapeHtml(main.name) + '" loading="lazy" decoding="async">';
      }

      let subHtml = '';
      if (subCats.length > 0) {
        subHtml = '<div class="cat-sub-chips">';
        subHtml += '<a href="products.html?cat=' + encodeURIComponent(main.id) + '" class="cat-sub-chip" style="background:var(--olive-100);color:var(--olive-800);">عرض الكل</a>';
        subCats.forEach(sub => {
          subHtml += '<a href="products.html?cat=' + encodeURIComponent(sub.id) + '" class="cat-sub-chip">' + escapeHtml(sub.name) + '</a>';
        });
        subHtml += '</div>';
      }

      return (
        '<div class="cat-main-card">' +
          '<a href="products.html?cat=' + encodeURIComponent(main.id) + '" class="cat-card-header">' +
            '<div class="cat-card-img">' + media + '</div>' +
            '<div class="cat-card-title">' +
              '<h3>' + escapeHtml(main.name) + '</h3>' +
              '<span>' + mainProdCount + ' منتج متوفر</span>' +
            '</div>' +
          '</a>' +
          subHtml +
        '</div>'
      );
    }).join("");
  }

  document.addEventListener("DOMContentLoaded", renderAllCategoriesPage);
  document.addEventListener("store:synced", renderAllCategoriesPage);
</script>
</body>
</html>
