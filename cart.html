<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السلة | متجرك الإلكتروني</title>
  <link rel="icon" href="assets/logo/logo.png">
  <link rel="stylesheet" href="css/style.css?v=44">
  <link rel="stylesheet" href="css/refresh.css?v=44">
  <style>
    /* تنسيق شريط التمرير للسلة (Mini Cart Slider) */
    .cart-items-wrapper {
      max-height: 55vh;
      overflow-y: auto;
      padding-left: 8px; /* مسافة لشريط التمرير */
      scrollbar-width: thin;
      scrollbar-color: var(--olive-400) transparent;
    }
    .cart-items-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .cart-items-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }
    .cart-items-wrapper::-webkit-scrollbar-thumb {
      background-color: var(--olive-400);
      border-radius: 10px;
    }
    @media (max-width: 900px) {
      .cart-items-wrapper {
        max-height: 45vh; /* تقليل الارتفاع في الجوال لضمان ظهور زر الطلب */
        padding-left: 4px;
      }
    }
  </style>
</head>
<body>

<div id="site-header" data-active="products"></div>

<main>
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / السلة</div>
      <h1>سلة التسوق</h1>
      <p>راجع منتجاتك ثم أكمل الطلب مباشرة عبر واتساب — لا حاجة لأي بيانات دفع إلكتروني.</p>
    </div>
  </section>

  <section class="section" style="padding-top:10px;">
    <div class="container">
      <div class="cart-layout">
        <div>
          <div id="cartWarning" class="setup-note" style="display:none;">
            بعض المنتجات في سلتك لم تعد متوفرة بالكامل، الرجاء مراجعة الكميات قبل إرسال الطلب.
          </div>
          <!-- إضافة الحاوية المسؤولة عن التمرير هنا -->
          <div class="cart-items-wrapper">
              <div id="cartItems"></div>
          </div>
        </div>

        <aside class="summary-card">
          <h3>ملخص الطلب</h3>
          <div class="summary-row"><span>عدد القطع</span><span id="cartItemCount">0</span></div>
          <div class="summary-row"><span>المجموع الفرعي</span><span id="cartSubtotal">0 د.ع</span></div>
          <div class="summary-row total"><span>الإجمالي</span><span id="cartTotal">0 د.ع</span></div>
          <button class="btn btn-whatsapp btn-block" id="checkoutBtn" style="margin-top:16px;">__ICON_WHATSAPP__ طلب عبر واتساب</button>
          <p id="cartDeliveryNote" style="font-size: 0.9rem; margin-top: 15px; line-height: 1.8;"></p>
        </aside>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js?v=44"></script>
<script src="js/icons.js?v=44"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/store.js?v=44"></script>
<script src="js/whatsapp.js?v=44"></script>
<script src="js/app.js?v=44"></script>
<script src="js/cart.js?v=44"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("checkoutBtn");
    if (btn && typeof iconSvg === "function") {
      btn.innerHTML = iconSvg("whatsapp") + " طلب عبر واتساب";
    }
  });
</script>
</body>
</html>
